databases:
  - name: app-auditoria-db
    databaseName: diabetes_db
    user: root
    plan: free

services:
  - type: web
    name: app-auditoria
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run db:push --prefix backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: app-auditoria-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
