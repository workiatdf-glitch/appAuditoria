version: '3.8'

services:
  db:
    image: postgres:15
    container_name: diabetes_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diabetes_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diabetes_backend
    environment:
      - DATABASE_URL=postgresql://root:password@db:5432/diabetes_db?schema=public
      - JWT_SECRET=supersecretkey_diabetes
      - PORT=3001
      - EXCEL_FILE_PATH=/app/onedrive/control diabetes 26.xlsx
    ports:
      - "3001:3001"
    depends_on:
      - db
    volumes:
      - "/Users/drpadrino/Library/CloudStorage/OneDrive-GOBIERNODETIERRADELFUEGO:/app/onedrive"
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diabetes_frontend
    environment:
      - VITE_API_URL=http://localhost:3001/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: diabetes_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: diabetes_ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: "http frontend:5173"
    ports:
      - "4040:4040"
    depends_on:
      - frontend

volumes:
  pgdata:
